spring:
  application:
    name: kabadiwala-connect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/kabadiwala_connect_2026}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET:development-only-secret-change-me-32chars-minimum}
  jwt-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
  jwt-refresh-days: ${JWT_REFRESH_EXPIRY_DAYS:14}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sms:
    provider: ${SMS_PROVIDER:development}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM_NUMBER:}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${LOCAL_STORAGE_DIR:./uploads}
    s3:
      bucket: ${S3_BUCKET:}
  payment:
    provider: ${PAYMENT_PROVIDER:manual}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  bootstrap:
    admin-mobile: ${BOOTSTRAP_ADMIN_MOBILE:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
