services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    depends_on: [mongo]
    environment:
      MONGODB_URI: mongodb://mongo:27017/kabadiwala_connect_2026
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_MOBILE: ${BOOTSTRAP_ADMIN_MOBILE:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-development}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports: ["8080:8080"]
    volumes: ["uploads:/app/uploads"]
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_BASE_URL: "http://localhost:8080/api/v1"}
    depends_on: [backend]
    ports: ["3000:80"]
volumes: {mongo_data: {}, uploads: {}}
